function chainN(name){const n=name.toLowerCase();
  return n.includes('tricarbo')?3:n.includes('dicarbo')?2:n.includes('carbocyanine')?1:0;}
function seriesOf(name){
  let s=name.replace(/^n/,'').replace(/tricarbocyanine|dicarbocyanine|carbocyanine|cyanine/i,'~')
            .replace(/iodide|chloride|p-toluenesulfonate/ig,'').replace(/\s+/g,'').trim();
  return s;}

  const lam=[],A=[];
  // normalize shape so peak = 1
  let maxg=0;
  for(let x=350;x<=900;x+=0.5){let g=0;for(let i=0;i<4;i++)g+=a[i]*Math.exp(-((x-c[i])**2)/s[i]);if(g>maxg)maxg=g;}

    let g=0;for(let i=0;i<4;i++)g+=a[i]*Math.exp(-((x-c[i])**2)/s[i]);
    let val=eps*conc*ell*g/maxg;
    if(addNoise) val+=0.002*(Math.random()-0.5)+0.004*val*(Math.random()-0.5);
    lam.push(x);A.push(val);
  }
  return {lam,A,eps};

function updateStruct(){
  const smi=(SMILES[sel.value]||'').split('.')[0];
  document.getElementById('genned').style.display = GENERATED.has(sel.value)?'':'none';
  const cas=CAS[sel.value];
  document.getElementById('casline').textContent = cas ? ('CAS ' + cas) : '';
  document.getElementById('smiline').textContent = smi;
  document.getElementById('inchiline').textContent = INCHI[sel.value] || '';
  const c=document.getElementById('structcanvas');
  c.getContext('2d').clearRect(0,0,c.width,c.height);
  try{ sd.draw(smi, '#structcanvas', 'light'); }catch(e){}
}
function draw(){
  const {lam,A}=spectrum();
  Plotly.newPlot('plot',[{x:lam,y:A,mode:'lines',line:{width:1.5}}],

}

document.getElementById('csv').addEventListener('click',()=>{

  let txt='Wavelength (nm),Absorbance\n';
  for(let i=0;i<lam.length;i++)txt+=lam[i]+','+A[i].toFixed(5)+'\n';
  const b=new Blob([txt],{type:'text/csv'});

  const el=document.createElement('a');el.href=u;

});
